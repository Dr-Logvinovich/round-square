name: Lean 4 Zero-Axiom Kernel Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-zero-axioms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install elan and Lean 4 Toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Package via Lake
        run: lake build

      - name: Audit All 74 Theorems for Zero Axioms
        run: |
          OUTPUT=$(lean RoundSquare.lean)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "sorryAx\|Classical.choice\|propext\|Quot.sound"; then
            echo "ERROR: Axiom or sorry detected!"
            exit 1
          fi
          COUNT=$(echo "$OUTPUT" | grep -c "does not depend on any axioms")
          echo "Verified $COUNT theorems with ZERO axioms!"
